version: "3.8"

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  init:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ${DATA_ROOT:-./ibvap/data}:/data
    command: >
      sh -c "mkdir -p /data && chown -R ${APP_UID:-1000}:${APP_UID:-1000} /data"

  backend:
    <<: *common
    build:
      context: ./ibvap
      dockerfile: backend/Dockerfile
    container_name: ${STACK_NAME:-ibvap}-backend
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:10028","http://localhost:5173"]}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
    volumes:
      - ${DATA_ROOT:-./ibvap/data}:/app/data
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { memory: 512M }
    networks: [internal]

  frontend:
    <<: *common
    build:
      context: ./ibvap/frontend
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-ibvap}-frontend
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-10028}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 256M }
    networks: [internal]

networks:
  internal:
    driver: bridge
